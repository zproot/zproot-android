name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zproot-android
        uses: actions/checkout@v6

      - name: Checkout zproot tracer
        uses: actions/checkout@v6
        with:
          repository: zproot/zproot
          path: tracer

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate build.zig
        id: locate
        run: |
          BUILD=$(find tracer -maxdepth 4 -name build.zig -not -path '*/zig-cache/*' | head -1)
          if [ -z "$BUILD" ]; then
            echo "no build.zig found in zproot/zproot"
            find tracer -type f -name "*.zig" | head -20
            exit 1
          fi
          DIR=$(dirname "$BUILD")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "found build.zig at $DIR"

      - name: Build libzproot.so
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe
          ls -la zig-out/bin/
          file zig-out/bin/zproot

      - name: Copy libzproot.so into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ${{ steps.locate.outputs.dir }}/zig-out/bin/zproot app/src/main/jniLibs/arm64-v8a/libzproot.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libzproot.so
          file app/src/main/jniLibs/arm64-v8a/libzproot.so

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: find app/build/outputs -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: zproot
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
