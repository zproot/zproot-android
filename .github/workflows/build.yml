name: Android build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android app
        uses: actions/checkout@v6

      - name: Checkout tracer
        uses: actions/checkout@v6
        with:
          repository: zproot/zproot
          path: tracer

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build tracer and PT_INTERP loader
        working-directory: tracer
        run: zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe

      - name: Package native executables
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 tracer/zig-out/bin/zproot app/src/main/jniLibs/arm64-v8a/libzproot.so
          install -m 0755 tracer/zig-out/bin/zproot-loader app/src/main/jniLibs/arm64-v8a/libzproot-loader.so
          file app/src/main/jniLibs/arm64-v8a/libzproot.so app/src/main/jniLibs/arm64-v8a/libzproot-loader.so

      - name: Run Android unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: zproot-android-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
